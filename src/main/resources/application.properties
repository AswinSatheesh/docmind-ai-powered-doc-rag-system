spring.application.name=Docmind

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Welcome@01}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File storage directory: Uses Linux /tmp/docmind-uploads on AWS, falls back to E:/DOC_MIND/filesStorageLocal on Windows
file.upload-dir=${UPLOAD_DIR:E:/DOC_MIND/filesStorageLocal}

#Google Gemini AI Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

spring.servlet.multipart.max-file-size =10MB
spring.servlet.multipart.max-request-size =10MB